name: temple_adventures
description: Temple Adventures Mobile Admin App

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.1.1+69

environment:
  sdk: '>=2.12.0 <3.0.0'

dependencies:
  flutter:
    sdk: flutter

  #-----------------------------------------

  #------------------------------------------
  #           State Management and Storage

  get: ^4.6.5
  get_storage: ^2.0.3
  #------------------------------------------
  #------------------------------------------
  #           Network & Testing
  #------------------------------------------
  #------------------------------------------
  #           UI and Animations

  #  docx_template: ^0.3.3
  #  flutter_document_picker: ^5.1.0
  pdf: ^3.8.4
