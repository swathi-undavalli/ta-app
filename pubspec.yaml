name: temple_adventures
description: Temple Adventures Mobile Admin App

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.1.1+88

environment:
  #  sdk: '>=2.12.0 <3.0.0'
  sdk: ">=3.0.0 <4.0.0"


dependencies:
  flutter:
    sdk: flutter

  # DO NOT UPDATE WITHOUT PROPER TESTING.
  firebase_messaging: ^14.2.5
  flutter_local_notifications: ^13.0.0
  get: ^4.6.5
  get_storage: ^2.1.1
  pdf: ^3.10.4
  intl:
  flutter_svg: ^2.0.7
  cached_network_image: ^3.3.0
  cupertino_icons: ^1.0.6
  permission_handler: ^11.0.1
  fluttertoast: ^8.2.2
  flutter_datetime_picker: ^1.5.1
  share: ^2.0.4
  url_launcher: ^6.1.14
  scroll_to_index: ^3.0.1
  barcode_widget: ^2.0.4
  firebase_auth: ^4.10.1
  firebase_core: ^2.17.0
  cloud_firestore: ^4.9.3
  package_info_plus:
  pin_code_fields: ^8.0.1
  lottie: ^2.6.0
  flutter_lints:
  image_picker: ^1.0.1
  image_cropper: ^4.0.1
  carousel_slider:
  image_gallery_saver:
  flutter_pdfview:



  # Data storage & DB
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  shared_preferences: ^2.0.11
  firebase_storage:
  http:
  path:
  path_provider:

dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true

  assets:
    - images/
    - images/assets/
    - assets/PDFs/

  fonts:
    - family: Nunito
      fonts:
        - asset: fonts/Nunito/Nunito-Black.ttf
        - asset: fonts/Nunito/Nunito-BlackItalic.ttf
        - asset: fonts/Nunito/Nunito-Bold.ttf
        - asset: fonts/Nunito/Nunito-BoldItalic.ttf
        - asset: fonts/Nunito/Nunito-ExtraBold.ttf
        - asset: fonts/Nunito/Nunito-ExtraBoldItalic.ttf
        - asset: fonts/Nunito/Nunito-ExtraLight.ttf
        - asset: fonts/Nunito/Nunito-ExtraLightItalic.ttf
        - asset: fonts/Nunito/Nunito-Italic.ttf
        - asset: fonts/Nunito/Nunito-LightItalic.ttf
        - asset: fonts/Nunito/Nunito-Regular.ttf
        - asset: fonts/Nunito/Nunito-SemiBold.ttf
        - asset: fonts/Nunito/Nunito-SemiBoldItalic.ttf
