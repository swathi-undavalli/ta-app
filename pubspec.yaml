name: temple_adventures
description: Temple Adventures Mobile Admin App

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 2.0.0+100

environment:
  sdk: ">=3.0.0 <4.0.0"


dependencies:
  flutter:
    sdk: flutter

  # DO NOT UPDATE WITHOUT PROPER TESTING.
  async: ^2.8.2
  firebase_messaging: ^15.0.3
  flutter_local_notifications: ^17.2.1+2
  get: ^4.6.6
  get_storage: ^2.1.1
  pdf: ^3.11.0
  intl: ^0.19.0
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  cupertino_icons: ^1.0.6
  permission_handler: ^11.3.1
  fluttertoast: ^8.2.6
  flutter_datetime_picker: ^1.5.1
  share_plus: ^10.0.0
  url_launcher: ^6.3.0
  scroll_to_index: ^3.0.1
  barcode_widget: ^2.0.4
  firebase_auth: ^5.1.2
  firebase_core: ^3.2.0
  cloud_firestore: ^5.2.0
  package_info_plus: ^8.0.1
  pin_code_fields: ^8.0.1
  lottie: ^3.1.2
  flutter_lints: ^4.0.0
  image_picker: ^1.1.2
  carousel_slider:
  image_gallery_saver:
  flutter_pdfview:
  provider:
  get_it: ^7.6.0
  temple_ui_tools:
    git:
      url: https://github.com/kameshWB/temple_ui_tools.git
      ref: main


  # Data storage & DB
  isar: ^3.1.0+1
  shared_preferences: ^2.2.3
  firebase_storage: ^12.1.1
  http: ^1.2.2
  path:
  path_provider: ^2.1.3
  freezed_annotation: ^2.4.4
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  freezed: ^2.5.2
  build_runner: ^2.4.9
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  assets:
    - images/
    - images/assets/
    - assets/PDFs/

  fonts:
    - family: Nunito
      fonts:
        - asset: fonts/Nunito/Nunito-Black.ttf
        - asset: fonts/Nunito/Nunito-BlackItalic.ttf
        - asset: fonts/Nunito/Nunito-Bold.ttf
        - asset: fonts/Nunito/Nunito-BoldItalic.ttf
        - asset: fonts/Nunito/Nunito-ExtraBold.ttf
        - asset: fonts/Nunito/Nunito-ExtraBoldItalic.ttf
        - asset: fonts/Nunito/Nunito-ExtraLight.ttf
        - asset: fonts/Nunito/Nunito-ExtraLightItalic.ttf
        - asset: fonts/Nunito/Nunito-Italic.ttf
        - asset: fonts/Nunito/Nunito-LightItalic.ttf
        - asset: fonts/Nunito/Nunito-Regular.ttf
        - asset: fonts/Nunito/Nunito-SemiBold.ttf
        - asset: fonts/Nunito/Nunito-SemiBoldItalic.ttf
